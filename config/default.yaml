# AI Experimental Playground - default configuration.
# Units: metres, kilograms, seconds, Newtons. Axes: +x east, +y north, +z up.
# Everything an experiment depends on lives here so runs are reproducible:
# the SHA-256 of the resolved config is stored with every session.

world:
  island:
    half_extent: 12.0        # walkable ground spans [-12, 12] in x and y
    sea_level: -2.0          # anything that sinks below this is lost for the session
  start: [0.0, 0.0]          # central starting location (ground level)
  gravity: 9.81
  timestep: 0.002            # 500 Hz
  platforms:
    - {id: platform_low,     name: "Low Step",      center: [-5.0,  5.0], size: [3.0, 3.0], height: 0.5, colour: "#7fae7f"}
    - {id: platform_mid,     name: "Mid Deck",      center: [-5.0, -5.0], size: [3.0, 3.0], height: 1.0, colour: "#6f9fb8"}
    - {id: platform_high,    name: "High Deck",     center: [ 2.0,  7.0], size: [3.0, 2.5], height: 1.5, colour: "#b89a6f"}
    # The terrace is flush against the west face of the spire (terrace spans x 4.6..7.6, spire 7.6..8.4).
    - {id: platform_terrace, name: "Spire Terrace", center: [ 6.1,  0.0], size: [3.0, 3.0], height: 2.0, colour: "#a98fc2"}
  spire: {id: spire, name: "THE SPIRE", center: [8.0, 0.0], size: [0.8, 0.8], height: 6.0, colour: "#d9d4c7"}
  blocks:
    count: 12
    reserve: 8               # extra block bodies that only exist once generated in-world
    size: 0.5
    mass: 5.0
    friction: 0.9
    colours: ["#d1495b", "#3b7dd8", "#edae49", "#3fa66b"]
    origin: [-2.5, -3.0]     # first block; laid out in rows of 6
    spacing: 1.0
  rock: {id: rock, name: "Large Rock", position: [-3.0, 2.0], radius: 0.3, mass: 12.0, friction: 0.9, colour: "#6b6b6b"}
  ring: {id: ring, name: "The Ring", position: [3.0, 3.0], major_radius: 0.7, tube_radius: 0.06, mass: 2.0,
         friction: 0.8, colour: "#f2c14e", segments: 16}

  # ---------------------------------------------------------------------------
  # Safety controls (M6-B stage B1). The PD joint-target route (set_joint_target
  # -> the _step PD loop -> d.qfrc_applied) was the ONE force path into MuJoCo
  # without validation: the M6-A audit demonstrated kp=1e6 producing 10 MN*m of
  # torque and NaN targets silently tripping MuJoCo's BADQACC guard. These
  # settings close that route for EVERY caller (scripted controllers, tools,
  # neural policies) at the single shared hook.
  safety:
    # |kp|/|kd| above these are clamped (and emit joint_gains_clamped). Clamped
    # gains cannot create unbounded force because the torque caps below bound
    # the final torque. Scripted peaks (recovery kp up to 600 at the stance
    # ankle) sit far below the ceilings.
    kp_ceiling: 1000.0
    kd_ceiling: 100.0
    # Target saturation into the joint's real range is a CONFIGURABLE MODE and
    # defaults OFF: the repo's existing controllers intentionally command beyond
    # model joint ranges (the combat strike raises the elbow to 2.35 rad against a
    # +-pi/2 limit and relies on MuJoCo's limit stop as part of its measured
    # dynamics; the recovery IK knee target is likewise over-range). Saturating
    # those targets rewrites them silently and changes their contact dynamics
    # (measured 2026-11-17: it destabilised the melee strike until the holder was
    # hit by its own weapon). Safety does not depend on it: the per-joint torque
    # caps bound the ACTUAL force of any finite target (e.g. 1e30 rad with kp 60
    # still writes at most the cap in N*m), and non-finite values are rejected.
    # Turn on (clamp_target: true) only for envs that want actuator-stop
    # semantics for policy-mapped targets.
    clamp_target: false
    # Per-joint PD torque caps, N*m, enforced in the PD loop.
    # EVIDENCE BASE (raw envelope measured 2026-11-17, caps disabled during
    # measurement, per-step sampling via register_step_callback so controller-internal
    # stepping is included; ai-playground-audit/probe_torque_results.json and
    # combat_envelope_probe.json):
    #   - standing, walking, running, 45/120-deg turning, two collapse+recovery poses
    #     (deep-fold and the canonical test_locomotion fold), scripted controller only:
    #     ankle 326.7 (walk; turns 305-314), hip 310.0 (recovery, kp 200), knee 452.3
    #     (canonical-recovery catch, kp 250), waist_yaw 41.3 (straight walk; turns <=
    #     23.7), spine 41.9 (recovery), head 10.6 (run pitch), foot_yaw 3.5;
    #   - M4 melee baton strike (swing raise kp 60/48): shoulder 124.3, elbow 166.3 —
    #     an earlier cap pair (40/30) clipped the strike's raise/strike transients and
    #     measurably altered its contact trajectory (self-contact impulse 15.92 vs
    #     17.70 N*s clean); the caps must clear the measured combat envelope.
    # FORCE PATH: the compiled humanoid has NO actuators (m.nu == 0) and there is no
    # gear or transmission — the PD loop writes generalized force directly into
    # d.qfrc_applied (N*m per hinge dof). The asset XML motor ctrlranges (hips +-30,
    # knees +-24) are the ASSET's hardware specification and do NOT bound this
    # controller stack; they are NOT used here. Caps sit ABOVE every measured
    # legitimate scripted peak (min ~1.22-1.33x margin) and far BELOW the runaway
    # scale demonstrated in the M6-A audit (~1e6 Nm, kp=1e6), bounding a rogue
    # controller 3+ orders of magnitude. For the small-torque families the cap is a
    # modest absolute value (~20-120 Nm) because extra headroom there costs nothing
    # and a runaway neural or noisy-gain command must still be bounded.
    # Keys: exact joint name wins, then the name with a left_/right_ prefix stripped,
    # then the head_* family, then 'default'.
    enforce_torque_limits: true
    torque_limits:
      default: 600.0
      spine_L2: 60.0
      waist_yaw: 120.0
      shoulder: 160.0
      elbow: 220.0
      hip: 400.0
      knee: 570.0
      ankle: 400.0
      head: 20.0
      foot_yaw: 20.0

agent_body:
  type: "box"
  limb_friction_engine: false  # humanoid walks CONTACT-DRIVEN (needs foot grip). true = frictionless/normal-only limbs (root-traction pairing; kept switchable for A/B).
  width: 0.44
  height: 1.6
  mass: 50.0
  walk_speed: 2.0            # default speed for move / walk_to
  max_speed: 4.0
  walk_force: 300.0          # traction limit of the walking controller
  traction_tau: 0.05         # time constant of the foot-traction controller
  jump_force: 2200.0         # N, leg force during push-off (acts on body + carried load)
  jump_push_time: 0.1        # s, duration of the push-off
  catch_max_speed: 15.0      # fastest relative speed at which a moving object can be grabbed
  max_climb: 1.05            # highest ledge, relative to the feet, that can be mantled
  climb_reach: 0.6           # horizontal reach when looking for a ledge
  climb_time: 0.8
  climb_max_carry: 6.0       # kg that can be carried while climbing
  reach: 1.5                 # pick-up / place reach from the body centre
  reach_up: 2.1              # highest placement point above the feet
  reach_down: 0.6
  max_carry: 25.0
  throw_force_max: 200.0
  throw_stroke: 0.6          # metres over which the throwing force acts
  push_stroke: 0.25          # metres over which a contact impulse (push/pull/slide/roll/kick/nudge) acts
  hold_height: 1.2           # held objects ride this far above the feet (box agent)
  hold_forward: 0.30         # humanoid carry: offset in front of the figure (waist-rotated)
  hold_height_humanoid: 0.84 # humanoid carry height (hanging-hand level, clear of the torso)

rules:
  # World rule that is never described to agents. See docs/RESEARCHER_NOTES.md.
  ring_generation:
    enabled: true
    dwell: 1.0               # seconds the configuration must persist
    charges: 8               # at most `blocks.reserve`

recording:
  frame_interval: 25         # physics steps between replay frames (20 Hz)
  keyframe_every: 200
  checkpoint_every_calls: 10
  collision_speed_threshold: 0.3
  collision_cooldown: 0.25   # a repeat contact between the same pair within this time is the same collision
  rest_speed: 0.05
  rest_time: 0.3
  min_air_time: 0.15         # airborne phases shorter AND lower than these are contact
  min_air_height: 0.03       # chatter (landing rebound), not recorded as falls

session:
  duration_minutes: 60
  max_steps: null            # optional cap on agent tool calls, for reproducible runs
  wrap_up_notice_minutes: 5
  wrap_up_notice_steps: 8
  max_wait_seconds: 30.0
  idle_turn_limit: 3
  loop_nudge: 4              # after N IDENTICAL failing calls in a row the runner tells the agent to change approach
  # A repeated failed call is real behaviour (logged as a message row, visible to the agent's
  # own history), but unbounded retry loops burn wall-clock on live models (measured
  # 2026-11-16: a 4B cycling one out_of_reach pick_up for minutes). The nudge names the exact
  # repeat; the streak resets on the next success. Set to 0 to disable.

memory:
  root: experiments/agents
  diary_entries_in_briefing: 12
  confirm_min_experiments: 2     # verified supporting experiments needed for "confirmed"
  probable_min_experiments: 1
  # Cap on the start-of-session memory briefing (audit 2026-11-13). A 2B/4B context window is ~12-16k
  # tokens and the tool schema alone is ~5k; an unbounded briefing (one grew to 22k chars) would crowd
  # out the conversation. The handbook, open goals and mistakes are kept; older diary/experiment detail
  # is summarised to fit. 0 disables the cap.
  briefing_char_budget: 6000

agents:
  count: 13
  id_format: "agent_{:03d}"
  # Personality/agency text for free exploration. free_agency_v3 = strictly non-directive
  # default (Nov 2026, no activity menu, no productivity nudges). free_agency_v2 = researcher
  # prompt kept for A/B; brief_v1 = original project-brief personality. Each session records
  # the id + hash it used.
  exploration_prompt: free_agency_v3

database: experiments/playground.db

# Neural-network (learning) tools. Added switches, audit 2026-11-13.
#   enabled: offer nn_* tools to agents at all (default true). Set false to run a pure-exploration
#            study with no learning tools in the interface.
#   agents.<id>.enabled: per-agent override of the above.
# Assigning a pre-trained network as an agent's whole brain is separate: use --adapter neural with a
# model spec (see docs/ML_LAB.md), not this block.
ml:
  enabled: true
  agents: {}

# ---------------------------------------------------------------------------
# RL environment contract (M6-B stage B2). The single authoritative contract
# is docs/RL_ENVIRONMENT.md; observation_layout()/action_layout() expose it
# to code (and later to the .aipg manifest). Every key here has a fallback
# constant in playground/rl/rewards.py + env.py; this block makes runs
# reproducible. Units: m, s, rad/s, N.
rl:
  contract_version: 2
  action_repeat: 10          # decisions = 10 x dt (0.002) = 20 ms policy period; PD still 500 Hz
  max_episode_steps: 400     # decision budget per episode (400 x 20 ms = 8 s benchmark horizon)
  start_pose_jitter: 0.15    # seeded reset start-position jitter box (+-m; spawn area is clear)
  target_velocity: [0.5, 0.0, 0.0]   # default world-frame walking target (heading 0 = +X)
  observation:
    joint_vel_scale: 6.0     # rad/s  (measured walk peak 4.83 -> 1.24x margin)
    root_vel_scale: 5.0      # m/s    (max_speed cap 4.0 -> 1.25x margin)
    contact_force_scale: 1000.0   # N per obs unit (stance loads measured 300-1000 N)
  # Reward weights (per 20-ms decision window). Justification from measured
  # envelopes lives in reports/m6b/B2_ENVIRONMENT.md and docs/RL_ENVIRONMENT.md.
  reward:
    progress: 8.0            # per metre of measured heading progress (clamped at |v*|*dt)
    velocity_tracking: 1.0
    tracking_sigma: 0.1      # kept at the v1 value for baseline comparability
    upright: 0.5
    alive: 1.0
    alive_margin: 0.4
    effort: 0.005            # per joule; scripted walk ~3.3 J/window -> ~-0.017/window
    smoothness: 0.1
    stability: 0.2
    stability_window: 25     # decisions (0.5 s) variance window on up_z
    fall: 5.0                # one-shot penalty magnitude at fall termination
  # PPO (B3 trainer, playground/rl/ppo.py). Every key here has a matching
  # fallback constant in PPO_HYPER_DEFAULTS; the config value wins.
  ppo:
    rollout_steps: 2048      # decisions collected per optimisation pass
    epochs: 4                # optimisation epochs over each rollout
    minibatch: 512
    lr: 3.0e-4               # Adam LR for actor and critic
    gamma: 0.99
    gae_lambda: 0.95
    clip_eps: 0.2
    ent_coef: 0.0            # Gaussian-entropy bonus coefficient
    value_coef: 0.5          # value-loss coefficient
    max_grad_norm: 0.5       # global-norm clip per network
    hidden: [64, 64]         # actor and critic trunk widths
    log_std_init: 0.0        # initial action sigma = 1.0
    target_kl: null          # optional early-stop KL threshold
  # Training-run driver settings (scripts/rl_ppo.py / PPOTrainer).
  ppo_run:
    total_steps: 2000000     # valid decision steps planned
    seed: 20261117           # master seed (init, sampling, reset poses)
    checkpoint_freq: 200000  # decisions between periodic checkpoints
    # Explicit per-stage budgets (decisions) applied through
    # Curriculum.advance(); everything after the last budget runs at the
    # final ladder stage (`sustained`). Remove entries to skip a stage; an
    # empty dict trains a single stage for the whole budget.
    stage_budgets:
      standing: 400000
      controlled: 500000

server:
  host: 127.0.0.1
  port: 8765

# Model gateway (playground/gateway). The gateway is mounted on the dashboard app; these
# settings tune the OpenAI-compatible /v1 passthrough and (stage C) its resource manager.
gateway:
  request_timeout: 300          # seconds for an outbound provider request
  # Security: by default the gateway is loopback-only (server.host 127.0.0.1) and needs no auth.
  # If you bind the dashboard to a non-loopback host, set auth_token_env to the NAME of an env var
  # holding a shared secret; every /v1 request must then present it (Authorization: Bearer <token>
  # or X-Gateway-Key). Without it on a non-loopback bind the gateway warns that /v1 is an open relay.
  auth_token_env: null
  # Backend-enforced concurrency + request queue. All limits default to 0 = unlimited, so the
  # gateway is unconstrained out of the box and behaves exactly as before. Raise a limit to cap
  # how many requests run at once in a scope; excess requests queue (ordered by priority, then
  # FIFO) until a slot frees. A request header X-Playground-Priority overrides default_priority.
  concurrency:
    max_concurrent: 0        # global cap across all providers/agents (0 = unlimited)
    provider_default: 0      # default per-provider cap; per_provider overrides by name
    model_default: 0         # default per-model cap; per_model overrides by name
    agent_default: 0         # default per-agent cap; per_agent overrides by name (stops monopoly)
    per_provider: {}         # e.g. {lmstudio: 2}
    per_model: {}            # e.g. {"qwen/qwen3.5-9b": 1}
    per_agent: {}            # e.g. {agent_001: 1}
    queue_max: 0             # max queued requests (0 = unbounded); reject with 429 when full
    default_priority: 5      # higher = scheduled sooner

# Agent "brains". The simulator is provider neutral; pick one with --adapter.
# Secrets are never stored here: api_key_env names an environment variable.
#
# openai_compat adapters accept two optional context-budget keys (audit 2026-11-13):
#   context_tokens: the model's loaded context window. 'auto' (or omitted) probes LM Studio's
#                   /api/v0/models at startup; a number pins it; leave off for non-LM-Studio servers.
#                   The adapter then keeps the WHOLE request (system + tool schemas + history + reply
#                   room) inside this window instead of letting the server silently truncate the middle.
#   reply_reserve_tokens: tokens kept free for the model's reply (default 1024).
adapters:
  scripted: {type: scripted}
  random:   {type: random}
  # Local XPU prefill is the latency bottleneck of long sessions: per-call prompt time grows
  # with history, and an auto-probed 262k window let the request grow to 30k+ history tokens
  # (3+ minutes per call). The pinned window bounds every call: the trim drops oldest
  # exchanges into a one-line-each digest, so the prompt NEVER grows past this bound no
  # matter how long the session runs. 32768 still allowed ~10k-token prompts with big tool
  # schemas + full physics results in the live window (measured 2026-11-16: 38.7 s prefill on
  # 9B, ~21 s on the 4B at 10k tokens) — 16384 roughly halves that. History, actions and
  # evidence all remain in the database and the agent's memory files; nothing about the
  # physics or the record loop depends on the in-prompt working set. Tune one number here.
  lmstudio:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: lowkeyqwen3.52b
    api_key_env: LM_API_KEY
    temperature: 0.7
    context_tokens: 16384
  # The researcher's custom Unsloth Qwen 4B (Q8_0, qwen35 arch) on LM Studio.
  lmstudio_unsloth4b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: "unslothqen 4b"
    api_key_env: LM_API_KEY
    temperature: 0.7
    context_tokens: 16384
  lmstudio_hauhaucs4b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: qwen3.5-4b-uncensored-hauhaucs-aggressive
    api_key_env: LM_API_KEY
    temperature: 0.7
  lmstudio_newest4b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: newest4b
    api_key_env: LM_API_KEY
    temperature: 0.7
  lmstudio_hauhaucs9b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: qwen3.5-9b-uncensored-hauhaucs-aggressive
    api_key_env: LM_API_KEY
    temperature: 0.7
  lmstudio_qwen9b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3.5-9b
    api_key_env: LM_API_KEY
    temperature: 0.7
    context_tokens: 16384
  lmstudio_claude_distilled9b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: qwen3.5-9b-claude-4.6-opus-reasoning-distilled-v2
    api_key_env: LM_API_KEY
    temperature: 0.7
  lmstudio_gpt_oss20b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: openai/gpt-oss-20b
    api_key_env: LM_API_KEY
    temperature: 0.7
    context_tokens: 16384
  lmstudio_nemotron4b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: nvidia/nemotron-3-nano-4b
    api_key_env: LM_API_KEY
    temperature: 0.7
  lmstudio_ministral14b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: mistralai/ministral-3-14b-reasoning
    api_key_env: LM_API_KEY
    temperature: 0.7
  lmstudio_lfm24b:
    type: openai_compat
    base_url: http://127.0.0.1:1234/v1
    model: liquid/lfm2-24b-a2b
    api_key_env: LM_API_KEY
    temperature: 0.7
  # Unsloth's local inference server (OpenAI-compatible; audit 2026-11-13). Unsloth serves
  # /v1/chat/completions on the port it started on (typically 8000 or 8888) with an sk-unsloth-… key.
  # Set UNSLOTH_STUDIO_AUTH_TOKEN and the right port. `model: default` uses whatever Unsloth loaded;
  # `playground models unsloth` lists the ids. context_tokens: auto probes the server's own window.
  unsloth:
    type: openai_compat
    base_url: http://127.0.0.1:8888/v1
    model: default
    api_key_env: UNSLOTH_STUDIO_AUTH_TOKEN
    temperature: 0.7
    context_tokens: auto
  ollama_cloud:
    type: openai_compat
    base_url: https://ollama.com/v1
    model: kimi-k3
    api_key_env: OLLAMA_API_KEY
    temperature: 0.7
  openai:
    type: openai_compat
    base_url: https://api.openai.com/v1
    model: gpt-5
    api_key_env: OPENAI_API_KEY
  claude:
    type: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 2048
  external: {type: external}     # driven over the HTTP API (Hermes, custom models, humans)

# Physics-extension simulation mode selector (Nov 2026).
# playground   = the original autonomous free playground (default; behaviour unchanged)
# training     = RL / curriculum physical-skill development
# arena        = multi-agent team matches
# interactive  = a human player joins the live simulation
simulation:
  mode: playground
