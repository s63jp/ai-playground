name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System libraries for headless MuJoCo
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libosmesa6

      - name: Install the package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          # CPU PyTorch so the neural-network tests actually run (the repo pins an XPU build for local dev).
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run the test suite (XPU-only tests excluded)
        env:
          MUJOCO_GL: egl
        run: python -m pytest -m "not xpu" -q
