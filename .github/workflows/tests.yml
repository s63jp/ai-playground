name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System libraries for headless MuJoCo
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libosmesa6

      - name: Install the package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          # CPU PyTorch so the neural-network tests actually run (the repo pins an XPU build for local dev).
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run the test suite (XPU + platform-physics tests excluded)
        env:
          MUJOCO_GL: egl
        run: |
          mkdir -p ci
          python -m pytest -m "not xpu and not physics" -q --junitxml=ci/results.xml

      # JUnit -> $GITHUB_STEP_SUMMARY: the failing test names + first line of
      # each failure surface in the checks API (job summaries are readable
      # without log-level auth, unlike the raw run logs).
      - name: Failure summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          out = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          results = pathlib.Path("ci/results.xml")
          if not results.exists():
              out.write_text("no ci/results.xml produced\n")
              raise SystemExit(0)
          suite = ET.parse(results).getroot().find("testsuite")
          head = (f"pytest: {suite.get('failures')} failed / "
                  f"{suite.get('errors')} errors / {suite.get('skipped')} "
                  f"skipped / {suite.get('tests')} total")
          rows = []
          for case in suite.iter("testcase"):
              for bad in ("failure", "error"):
                  n = case.find(bad)
                  if n is not None:
                      text = (n.get("message") or "")[:220].replace("\n", " ")
                      rows.append(f"{case.get('classname')}::{case.get('name')} "
                                  f"— {text}")
          out.write_text("\n".join([head] + (rows[:80] or ["all green"])) + "\n")
          PY
